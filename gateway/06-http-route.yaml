apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app1
  namespace: roboshop
spec:
  parentRefs:
    - name: roboshop-gateway
      sectionName: https
  hostnames:
   - "app1.devops90s.shop"    

  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /
      backendRefs:
      - name: app1
        port: 80