apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-2
  # labels related to deployment resource
  labels:
    app: app-2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-2
  # Pod
  template:
    metadata:
      labels:
        app: app-2
    spec:
      containers:
      - name: app-2
        image: imranjoindevops/app2
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app-2
  # servicer labels
  labels:
    app: app-2
spec:
  # Service uses the below labels to select the pods
  selector:
    app: app-2
  ports:
    - protocol: TCP
      port: 80 # service port
      targetPort: 80 # container port
